<!DOCTYPE html>
<html lang="en">
<head>	
    	<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>ThornDuck</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&display=swap" rel="stylesheet">
		<link rel="preload" as="image" href="imgs/main_background.png" fetchpriority="high">
    	<link rel="stylesheet" href="styles/style.css">
		<link rel="icon" href="imgs/icon_32.ico">
</head>

<body>
<header id="header"></header>

<main>
	<img id="main-logo" class="pixel-perfect-image" src="imgs/thornduck_160x80_2025.gif" alt="ThornDuck logo">

	<div class="text text-center">
		<p>
			Crafting <span class="colored-text">crazy little worlds</span> with love and care, and sharing <span class="colored-text">unique experiences</span> with you!
		</p>
	</div>

	<section id="games">
		<h2>GAMES</h2>

		<div class="games-group">
			<h3 class="games-subheading">OFFICIAL RELEASES</h3>

			<div class="games-grid official-games" id="official-games-grid"></div>
		</div>

		<div class="games-group">
			<h3 class="games-subheading">GAME JAM GAMES</h3>

			<div class="games-grid jam-games" id="jam-games-grid"></div>
		</div>
	</section>
</main>

<footer id="footer"></footer>

<script src="scripts/script.js"></script>
</body>
</html>
