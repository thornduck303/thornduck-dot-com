<!DOCTYPE html>
<html lang="en">
<head>	
    	<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>ThornDuck - Blog</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&display=swap" rel="stylesheet">
		<link rel="preload" as="image" href="imgs/main_background.png" fetchpriority="high">
    	<link rel="stylesheet" href="styles/style.css">
		<link rel="icon" href="imgs/icon_32.ico">
</head>

<body>
<header id="header"></header>

<main class="no-bg">
	<section id="blog">
		<h2>BLOG</h2>

		<p class="text">Get <span class="colored-text">new</span> posts delivered to your inbox.</p>

		<div class="newsletter">
			<input type="email" id="email" name="email" placeholder="Email Address">
			<button type="button" class="newsletter-btn">SUBSCRIBE</button>
		</div>

		<div class="blog-posts" id="blog-posts"></div>
	</section>
</main>

<footer id="footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="scripts/script.js"></script>
</body>
</html>
